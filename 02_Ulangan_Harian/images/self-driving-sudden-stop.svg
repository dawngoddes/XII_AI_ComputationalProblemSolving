<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#eef3ff"/>
    <stop offset="1" stop-color="#f9fbff"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#1f3d75" flood-opacity=".12"/>
  </filter>
</defs>

<rect width="1200" height="520" rx="28" fill="url(#bg)"/>
<text x="55" y="72" font-family="Segoe UI, Arial" font-size="30" font-weight="800" fill="#1b2a4a">
  Ketika Self-Driving Car Mendeteksi Mobil di Depan Berhenti Mendadak
</text>

<rect x="55" y="125" width="1090" height="300" rx="24" fill="#e5e8ee"/>
<rect x="55" y="270" width="1090" height="8" fill="#ffffff" opacity=".95"/>
<rect x="55" y="390" width="1090" height="8" fill="#ffffff" opacity=".95"/>
<rect x="365" y="133" width="16" height="292" fill="#c9cdd5"/>
<rect x="725" y="133" width="16" height="292" fill="#c9cdd5"/>

<!-- self-driving car -->
<g transform="translate(180,220)">
  <rect x="0" y="52" width="250" height="105" rx="26" fill="#3157d5" filter="url(#shadow)"/>
  <rect x="42" y="12" width="167" height="70" rx="24" fill="#5c78df"/>
  <circle cx="55" cy="158" r="19" fill="#262b35"/>
  <circle cx="205" cy="158" r="19" fill="#262b35"/>
  <rect x="20" y="98" width="35" height="15" rx="7" fill="#ffdc72"/>
  <rect x="195" y="98" width="35" height="15" rx="7" fill="#ff5757"/>
  <text x="125" y="205" text-anchor="middle" font-family="Segoe UI, Arial" font-size="19" font-weight="800" fill="#20365d">
    Self-driving car
  </text>
</g>

<!-- stopped car -->
<g transform="translate(790,175)">
  <rect x="0" y="70" width="245" height="120" rx="28" fill="#6e7480" filter="url(#shadow)"/>
  <rect x="38" y="20" width="170" height="78" rx="25" fill="#858c99"/>
  <circle cx="56" cy="190" r="19" fill="#262b35"/>
  <circle cx="195" cy="190" r="19" fill="#262b35"/>
  <rect x="18" y="110" width="35" height="16" rx="7" fill="#ff4f52"/>
  <rect x="192" y="110" width="35" height="16" rx="7" fill="#ff4f52"/>
  <text x="123" y="235" text-anchor="middle" font-family="Segoe UI, Arial" font-size="19" font-weight="800" fill="#30405f">
    Mobil berhenti mendadak
  </text>
</g>

<!-- distance warning -->
<path d="M475 285 H760" stroke="#f04455" stroke-width="10" stroke-dasharray="18 16"/>
<text x="620" y="257" text-anchor="middle" font-family="Segoe UI, Arial" font-size="22" font-weight="900" fill="#b22d3c">
  JARAK MENDEKAT
</text>
</svg>